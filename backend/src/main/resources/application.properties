spring.application.name=game-tracker

# Dev only: start the Postgres container from the repo-root compose file and
# configure the datasource from it. The path is relative to the working
# directory, so run the app from backend/.
spring.docker.compose.file=../docker-compose.yml

# Flyway owns the schema. Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
